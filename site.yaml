metadata:
  title: "Isometry"
  author: "Dark Mode Games"
  description: "Isometry: a data-driven isometric RPG framework. Build a multiplayer game by writing JSON or YAML, not code."
  language: "en-US"
  version: "0.410"
  nav:
    - {title: "Home", url: "/"}
    - {title: "Download", url: "/platform/"}
    - {title: "Player Guide", url: "/guide/"}
    - {title: "Manual", url: "/manual/"}
    - {title: "Reference", url: "/reference/"}
    - {title: "Recipes", url: "/recipes/"}
    - {title: "Updates", url: "/updates/"}
    - {title: "About", url: "/about/"}

discovery:
  root: "."
  exclude:
    - ".git"
    - ".venv"
    - "venv"
    - "node_modules"
    - "__pycache__"
    - "build"
    - "dist"
    - "context"
    - "templates"
    - "assets"
  content_extensions:
    - ".md"
  image_extensions:
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".gif"
    - ".svg"
    - ".ico"
  css_extensions:
    - ".css"

output:
  dir: "build"
